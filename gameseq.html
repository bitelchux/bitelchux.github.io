<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emoji Logic Sequences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pink:#FF6B9D;--purple:#9B5CFF;--lilac:#C77DFF;--sky:#4FB8FF;--sun:#FFD93D;--green:#3CC36E;--orange:#FF9F43;
  --ink:#2D2A4A;--mid:#7B789A;--card:rgba(255,255,255,.94);--sh:0 8px 30px rgba(45,42,74,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;font-family:'Nunito',system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
body{background:linear-gradient(150deg,#a8edea 0%,#fed6e3 50%,#d4e7ff 100%) fixed;overflow-x:hidden}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.33;pointer-events:none;z-index:0;animation:float 10s ease-in-out infinite}
.b1{width:60vmin;height:60vmin;background:#FFD93D;top:-15vmin;left:-15vmin}
.b2{width:50vmin;height:50vmin;background:#FF6B9D;bottom:-12vmin;right:-12vmin;animation-delay:-4s}
.b3{width:38vmin;height:38vmin;background:#6BCB77;top:40%;left:60%;animation-delay:-7s}
@keyframes float{50%{transform:translate(0,-26px) scale(1.06)}}

.screen{display:none;position:relative;z-index:1}
.screen.show{display:flex}

/* ───────── MENU ───────── */
#menu{min-height:100dvh;align-items:center;justify-content:center;padding:16px}
.menu-card{background:var(--card);backdrop-filter:blur(14px);border-radius:32px;box-shadow:0 20px 70px rgba(45,42,74,.2);
  width:100%;max-width:440px;padding:clamp(20px,5vw,36px);text-align:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.logo-big{font-size:clamp(2.6rem,10vw,3.4rem);animation:wob 3s ease-in-out infinite;display:inline-block}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.title{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(1.55rem,6.5vw,2.2rem);line-height:1.1;
  background:linear-gradient(135deg,var(--pink),var(--purple),var(--sky));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{color:var(--mid);font-weight:800;font-size:clamp(.8rem,3vw,.95rem);margin:6px 0 14px}
.demo{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.demo span{width:42px;height:42px;border-radius:13px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;font-size:1.5rem;animation:hop 1.8s ease-in-out infinite}
.demo span:last-child{border:2.5px dashed var(--lilac);color:var(--purple);font-family:'Fredoka One';font-size:1.2rem}
@keyframes hop{0%,70%,100%{transform:none}35%{transform:translateY(-8px)}}
.lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:1.2px;color:#aaa;font-weight:900;margin:0 0 8px;text-align:left}
.ages{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:18px}
.age{background:#fff;border:2.5px solid #ebe8f5;border-radius:18px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .2s cubic-bezier(.34,1.56,.64,1),border-color .2s,box-shadow .2s}
.age:hover{transform:translateY(-4px)}
.age.sel{border-color:var(--purple);background:linear-gradient(140deg,#f5eeff,#ffeef6);box-shadow:0 8px 22px rgba(155,92,255,.28);transform:translateY(-3px) scale(1.03)}
.age .ae{font-size:clamp(1.8rem,7vw,2.3rem)}
.age b{font-family:'Fredoka One';font-weight:400;font-size:clamp(.8rem,3vw,.98rem)}
.age small{font-size:.65rem;color:var(--mid);font-weight:800}
.langs{display:flex;gap:8px;justify-content:center;margin-bottom:18px;flex-wrap:wrap}
.lang{border:2px solid #e3e0ef;border-radius:12px;padding:7px 13px;font-weight:900;font-size:.8rem;background:#fff;color:var(--mid);transition:.18s}
.lang.sel{background:var(--purple);border-color:var(--purple);color:#fff}
.big-btn{width:100%;padding:15px;border-radius:18px;background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;
  font-family:'Fredoka One';font-size:clamp(1.05rem,4vw,1.25rem);box-shadow:0 8px 24px rgba(155,92,255,.38);transition:transform .18s,opacity .2s}
.big-btn:hover:not(:disabled){transform:translateY(-2px)}
.big-btn:active:not(:disabled){transform:scale(.97)}
.big-btn:disabled{opacity:.45;cursor:not-allowed}
.ghost-btn{width:100%;margin-top:10px;padding:12px;border-radius:16px;border:2.5px solid var(--green);color:var(--green);background:#fff;font-family:'Fredoka One';font-size:clamp(.88rem,3.4vw,1.02rem);transition:.18s}
.ghost-btn:hover{background:var(--green);color:#fff}

/* ───────── GAME ───────── */
#game{flex-direction:column;min-height:100dvh;max-width:720px;margin:0 auto;padding:max(10px,env(safe-area-inset-top)) 10px 0;gap:8px}
.bar{display:flex;align-items:center;gap:8px;background:var(--card);backdrop-filter:blur(12px);border-radius:20px;padding:8px 10px;box-shadow:var(--sh)}
.bar .gl{flex:1;min-width:0;font-family:'Fredoka One';font-size:clamp(.85rem,3.4vw,1.1rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(135deg,var(--pink),var(--purple),var(--sky));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ib{min-width:38px;height:38px;border-radius:12px;background:#fff;border:2px solid #ece9f6;font-size:1rem;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 8px;transition:.15s}
.ib:hover{border-color:var(--lilac);transform:scale(1.06)}
.stats{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:6px}
.pill{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:7px 10px;display:flex;align-items:center;gap:7px;min-width:0}
.pill .i{font-size:1.1rem}
.pill .v{font-family:'Fredoka One';font-size:clamp(.92rem,3.4vw,1.12rem);line-height:1}
.pill .k{font-size:.56rem;text-transform:uppercase;letter-spacing:.6px;color:#aaa;font-weight:900}
.lvl{background:linear-gradient(135deg,var(--pink),var(--purple));color:#fff;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 12px}
.lvl .v{font-size:clamp(1rem,3.8vw,1.2rem)}
.lvl .k{color:rgba(255,255,255,.85)}
.timer{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:8px 12px}
.trow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-weight:900;font-size:.68rem;color:#aaa;text-transform:uppercase;letter-spacing:.7px}
.trow b{font-family:'Fredoka One';font-weight:400;font-size:.95rem;color:var(--ink);letter-spacing:0}
.hearts{font-size:.95rem;letter-spacing:1px}
.hearts .lost{opacity:.18;filter:grayscale(1)}
.track{height:10px;background:rgba(0,0,0,.07);border-radius:10px;overflow:hidden}
.fill{height:100%;width:100%;border-radius:10px;background:linear-gradient(90deg,#3CC36E,#4FB8FF);transition:width .12s linear}
.fill.warn{background:linear-gradient(90deg,#FFD93D,#FF9F43)}
.fill.danger{background:linear-gradient(90deg,#FF6B9D,#ff3b3b);animation:blink .5s ease-in-out infinite}
@keyframes blink{50%{opacity:.55}}

.card{flex:1;background:var(--card);backdrop-filter:blur(14px);border-radius:26px;box-shadow:0 12px 44px rgba(45,42,74,.15);
  padding:clamp(12px,3.5vw,22px);display:flex;flex-direction:column;gap:14px}
.card.pop{animation:pop .42s cubic-bezier(.34,1.56,.64,1)}
.card.shake{animation:shake .42s}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.02)}100%{transform:none;opacity:1}}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.prompt{font-family:'Fredoka One';font-size:clamp(.95rem,3.8vw,1.2rem);color:var(--purple);display:flex;align-items:center;gap:6px}
.band{font-size:.66rem;font-weight:900;background:#f1edfb;color:var(--mid);border-radius:9px;padding:4px 9px;white-space:nowrap}
.dots{display:flex;gap:6px;justify-content:center}
.dot{width:12px;height:12px;border-radius:50%;background:#e7e3f3;transition:.3s}
.dot.done{background:linear-gradient(135deg,var(--green),var(--sky));transform:scale(1.1)}
.dot.now{background:var(--lilac);animation:beat 1.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.35)}}

.seq{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;--ts:56px;padding:6px 0}
.tok{width:var(--ts);height:var(--ts);flex-shrink:0;border-radius:calc(var(--ts)*.28);display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--ts)*.6);line-height:1;background:linear-gradient(145deg,#fff,#f4eeff);
  box-shadow:0 3px 10px rgba(45,42,74,.1),inset 0 1px 0 #fff;position:relative;animation:tokIn .35s backwards cubic-bezier(.34,1.56,.64,1)}
@keyframes tokIn{from{transform:scale(.4);opacity:0}}
.tok.num,.tok.let{font-family:'Fredoka One';color:#5b3fd1;font-size:calc(var(--ts)*var(--nf,.5));width:auto;min-width:var(--ts);padding:0 calc(var(--ts)*.14)}
.tok.let{color:#e2457e}
.tok.grp{width:auto;min-width:var(--ts);padding:calc(var(--ts)*.08)}
.gin{display:grid;grid-template-columns:repeat(var(--gc),auto);gap:1px;font-size:calc(var(--ts)*var(--gf));line-height:1;justify-content:center}
.sz0{font-size:calc(var(--ts)*.28)}.sz1{font-size:calc(var(--ts)*.5)}.sz2{font-size:calc(var(--ts)*.8)}
.tok.blank{background:repeating-linear-gradient(45deg,#f6efff,#f6efff 6px,#fdf4ff 6px,#fdf4ff 12px);border:2.5px dashed var(--lilac);box-shadow:none;
  color:var(--lilac);font-family:'Fredoka One';font-size:calc(var(--ts)*.45)}
.tok.blank.active{border:3px solid var(--purple);color:var(--purple);animation:glow 1.3s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(155,92,255,.45);transform:scale(1)}50%{box-shadow:0 0 0 7px rgba(155,92,255,0);transform:scale(1.07)}}
.tok.filled{background:linear-gradient(145deg,#e9fff1,#cdf7dd);box-shadow:0 0 0 2.5px var(--green);animation:fillPop .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes fillPop{0%{transform:scale(.5)}60%{transform:scale(1.25)}100%{transform:none}}
.sep{width:6px;height:calc(var(--ts)*1.1);border-radius:6px;background:linear-gradient(var(--lilac),var(--sky));box-shadow:0 0 12px rgba(155,92,255,.5);flex-shrink:0;margin:0 4px}

.chl{font-size:.68rem;text-transform:uppercase;letter-spacing:1px;color:#aaa;font-weight:900;text-align:center;margin-bottom:-6px}
.choices{display:grid;gap:10px;grid-template-columns:repeat(var(--cols,4),1fr);--ts:64px;max-width:520px;width:100%;margin:0 auto}
.choice{aspect-ratio:1;border-radius:20px;background:linear-gradient(145deg,#fff,#fff3fa);box-shadow:0 5px 16px rgba(45,42,74,.12),inset 0 1px 0 #fff;
  display:flex;align-items:center;justify-content:center;border:2.5px solid transparent;transition:transform .17s cubic-bezier(.34,1.56,.64,1),border-color .15s;overflow:hidden}
.choice:hover:not(:disabled){transform:translateY(-4px) scale(1.06);border-color:var(--pink)}
.choice:active:not(:disabled){transform:scale(.92)}
.choice .tok{background:none;box-shadow:none;animation:none}
.choice.wrong{border-color:#ff4f4f;background:#ffecec;animation:jig .35s}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice.right{border-color:var(--green);background:#e9fff1}
@keyframes jig{25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.fb{text-align:center;font-family:'Fredoka One';font-size:clamp(1rem,4vw,1.35rem);min-height:1.6em}
.fb.ok{color:var(--green)}.fb.bad{color:var(--pink)}.fb.info{color:var(--purple)}

.next-bar{position:sticky;bottom:0;z-index:5;padding:8px 0 max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(212,231,255,.95) 55%,rgba(212,231,255,0))}
#nextBtn{width:100%;padding:15px;border-radius:18px;font-family:'Fredoka One';font-size:clamp(1rem,4vw,1.2rem);color:#fff;
  background:linear-gradient(135deg,#9a98b4,#b9b7cc);box-shadow:0 5px 16px rgba(0,0,0,.12);transition:.2s}
#nextBtn.on{background:linear-gradient(135deg,var(--green),#24a957);box-shadow:0 8px 24px rgba(60,195,110,.42);animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(-3px)}}

/* overlays & particles */
.ov{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(20,16,50,.55);backdrop-filter:blur(10px)}
.ov.show{display:flex}
.ov-card{background:#fff;border-radius:30px;padding:clamp(24px,6vw,40px);max-width:360px;width:100%;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.3);animation:pop .48s cubic-bezier(.34,1.56,.64,1)}
.ov-e{font-size:clamp(3.2rem,13vw,4.6rem);display:block;animation:wob 1.6s ease-in-out infinite}
.ov-t{font-family:'Fredoka One';font-size:clamp(1.5rem,6vw,2rem);margin:6px 0;background:linear-gradient(135deg,var(--pink),var(--purple));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.ov-s{color:var(--mid);font-weight:800;margin-bottom:6px}
.ov-x{color:var(--purple);font-weight:900;font-size:.85rem;margin-bottom:18px;line-height:1.5;white-space:pre-line}
.pt{position:fixed;pointer-events:none;z-index:60;animation:fly .9s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2) rotate(200deg);opacity:0}}
.cf{position:fixed;top:-14px;pointer-events:none;z-index:60;animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<!-- MENU -->
<section id="menu" class="screen show">
  <div class="menu-card">
    <div class="logo-big">🧩</div>
    <h1 class="title">Emoji Logic Sequences</h1>
    <p class="sub" data-i="sub"></p>
    <div class="demo"><span>🍎</span><span>🍌</span><span>🍎</span><span>🍌</span><span>?</span></div>
    <div class="lbl" data-i="who"></div>
    <div class="ages">
      <button class="age" data-age="3"><span class="ae">🐣</span><b data-i="ages.0"></b><small data-i="ageD.0"></small></button>
      <button class="age" data-age="6"><span class="ae">🚀</span><b data-i="ages.1"></b><small data-i="ageD.1"></small></button>
      <button class="age" data-age="9"><span class="ae">🧠</span><b data-i="ages.2"></b><small data-i="ageD.2"></small></button>
    </div>
    <div class="lbl" data-i="lang"></div>
    <div class="langs">
      <button class="lang" data-l="en">🇬🇧 English</button>
      <button class="lang" data-l="es">🇪🇸 Español</button>
      <button class="lang" data-l="fr">🇫🇷 Français</button>
    </div>
    <button class="big-btn" id="startBtn" disabled></button>
    <button class="ghost-btn" id="contBtn" style="display:none"></button>
  </div>
</section>

<!-- GAME -->
<section id="game" class="screen">
  <div class="bar">
    <button class="ib" id="homeBtn" title="Menu">🏠</button>
    <div class="gl">🧩 Emoji Logic Sequences</div>
    <button class="ib" id="langBtn">EN</button>
    <button class="ib" id="sndBtn">🔊</button>
  </div>
  <div class="stats">
    <div class="pill lvl"><div class="k" data-i="level"></div><div class="v" id="lvlV">1</div></div>
    <div class="pill"><span class="i">⭐</span><div><div class="v" id="scoreV">0</div><div class="k" data-i="score"></div></div></div>
    <div class="pill"><span class="i">🔥</span><div><div class="v" id="streakV">0</div><div class="k" data-i="streak"></div></div></div>
    <div class="pill"><span class="i">🏆</span><div><div class="v" id="bestV">0</div><div class="k" data-i="best"></div></div></div>
  </div>
  <div class="timer">
    <div class="trow"><span data-i="time"></span><span class="hearts" id="hearts"></span><b id="tV">30s</b></div>
    <div class="track"><div class="fill" id="tFill"></div></div>
  </div>
  <div class="card" id="card">
    <div class="ptop"><div class="prompt" id="prompt"></div><span class="band" id="band"></span></div>
    <div class="dots" id="dots"></div>
    <div class="seq" id="seq"></div>
    <div class="chl" id="chl"></div>
    <div class="choices" id="choices"></div>
    <div class="fb" id="fb"></div>
  </div>
  <div class="next-bar"><button id="nextBtn"></button></div>
</section>

<div class="ov" id="ov"><div class="ov-card">
  <span class="ov-e" id="ovE"></span><div class="ov-t" id="ovT"></div><div class="ov-s" id="ovS"></div><div class="ov-x" id="ovX"></div>
  <button class="big-btn" id="ovB"></button>
</div></div>

<script>
/*GEN_START*/
// ════════════════ DETERMINISTIC RNG ════════════════
function mkRand(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashSeed(){let h=2166136261>>>0;for(let i=0;i<arguments.length;i++){h^=((arguments[i]+1)*2654435761)>>>0;h=Math.imul(h,16777619)>>>0;h^=h>>>15;}return h>>>0;}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuf(r,arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// ════════════════ TOKENS ════════════════
const E=v=>({t:'e',v}),N=v=>({t:'n',v}),G=(e,n)=>({t:'g',e,n}),Sz=(e,s)=>({t:'s',e,s}),Lt=v=>({t:'l',v}),SEP={t:'sep'};
function key(k){return k.t==='g'?'g'+k.e+'|'+k.n:k.t==='s'?'s'+k.e+'|'+k.s:k.t==='sep'?'sep':k.t+'|'+k.v;}
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// ════════════════ CONTENT ════════════════
const POOLS=[
  ['🐶','🐱','🐭','🐰','🦊','🐻','🐼','🐸'],['🍎','🍌','🍇','🍓','🍊','🍉','🍒','🥝'],
  ['🚗','🚀','🚲','✈️','🚂','🚁','⛵','🚌'],['🐟','🐙','🦀','🐳','🐢','🦈','🐬','🐚'],
  ['🍕','🍔','🌭','🍟','🍩','🍪','🧁','🍦'],['⚽','🏀','🎾','🏈','⚾','🏐','🎱','🏓'],
  ['🌸','🌻','🌵','🍄','🌲','🍁','🌷','🍀'],['😀','😎','😴','🤩','😜','😡','🥶','🤠'],
  ['🐝','🐞','🦋','🐛','🐜','🕷️','🐌','🦗'],['🎸','🥁','🎹','🎺','🎻','🎷','🎤','🪗'],
  ['🧸','🎈','🪁','🎁','🪀','🎲','🧩','🪅'],['☀️','🌙','⭐','☁️','⚡','❄️','🌈','🔥'],
  ['🐮','🐷','🐔','🐴','🐑','🐐','🦆','🦃'],['🦁','🐯','🐘','🦒','🦓','🦏','🐊','🦍'],
  ['🦄','🐉','🧙','🧚','👑','💎','🔮','🪄'],['👕','👖','🧦','👟','🧢','👗','🧤','🎩']
];
const COLORS=['🔴','🟠','🟡','🟢','🔵','🟣','🟤','⚫'];
const SHAPES=['🔺','🟦','⭐','❤️','🔶','🌙','⚪','💠'];
const SIZE_EMOJI=['⭐','🐞','🍎','🐳','🌸','⚽','🐢','🎈','🦄','🍩'];
const CYCLES=[
  ['🌑','🌒','🌓','🌔','🌕','🌖','🌗','🌘'],
  ['⬆️','↗️','➡️','↘️','⬇️','↙️','⬅️','↖️'],
  ['🕛','🕐','🕑','🕒','🕓','🕔','🕕','🕖','🕗','🕘','🕙','🕚']

// ════════════════ DIFFICULTY (continuous, gradual) ════════════════
// D grows 0.1 per level. Ages 3–5 start at 0, 6–8 at 2, 9–12 at 4.

// ════════════════ REPEATING PATTERNS ════════════════
const T_EASY=[[0,1],[0,0,1],[0,1,1]];

// ════════════════ COUNTING GROUPS ════════════════
function genGroups(r,D){

// ════════════════ NUMBER RULES ════════════════
function numResult(r,v,ctx,D,blanks,disFn){

  else{step=ri(r,2,Math.min(15,2+Math.floor(D)));start=ri(r,1,Math.min(99,5*Math.ceil(D)));desc=r()<0.4;}

// ════════════════ CYCLES / MIRROR / MIXED ════════════════
function genCycle(r,D){

function genMirror(r,D){

const LANGS=['en','es','fr'];

// ════════════════ AUDIO (Web Audio, no files) ════════════════
let actx=null;
function ac(){if(!actx){try{actx=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended')actx.resume();return actx;}
function tone(f,type,dur,vol,when,slide){
  if(!S.sound)return;const c=ac();if(!c)return;
  try{const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(when||0);
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||.2,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02);}catch(e){}
}
const sfx={
  click:()=>tone(700,'sine',.06,.12),
  fill:()=>{tone(660,'triangle',.12,.2);tone(990,'triangle',.14,.16,.07);},
  ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,'sine',.2,.22,i*.08)),
  bad:()=>{tone(260,'sawtooth',.22,.14,0,140);tone(200,'square',.16,.07,.05)},
  tick:()=>tone(1250,'square',.04,.06),
  timeout:()=>{tone(400,'sawtooth',.5,.16,0,110);},
  lvl:()=>{[523,659,784,1047,1319].forEach((f,i)=>tone(f,'triangle',.25,.24,i*.1));[784,1047,1568].forEach((f,i)=>tone(f,'sine',.4,.2,.6+i*.12));},
  over:()=>[440,370,311,262].forEach((f,i)=>tone(f,'triangle',.3,.2,i*.16)),
  whoosh:()=>tone(300,'sine',.18,.1,0,900)
};

// ════════════════ STATE & SAVE ════════════════
const SAVE_KEY='els_v7';
const S={lang:'en',sound:true,age:null,level:1,score:0,best:0,streak:0,hearts:3,q:0,cur:null,ptr:0,solved:false,tMax:30,tLeft:30,timer:null,ov:false,menuAge:null};
let saved=null;
function readSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY)||'null');}catch(e){return null;}}
function save(){
  const b=readSave()||{};Object.assign(b,{lang:S.lang,sound:S.sound,best:S.best});
  if(S.age)Object.assign(b,{age:S.age,level:S.level,score:S.score,q:S.q});
  try{localStorage.setItem(SAVE_KEY,JSON.stringify(b));}catch(e){}
  saved=b.age?b:null;
}
function L(){return I18N[S.lang];}
const $=id=>document.getElementById(id);

function applyI18n(){
  document.documentElement.lang=S.lang;
  document.querySelectorAll('[data-i]').forEach(el=>{const p=el.dataset.i.split('.');let v=L();p.forEach(k=>v=v[k]);el.textContent=v;});
  $('langBtn').textContent=S.lang.toUpperCase();
}

// ════════════════ MENU ════════════════
function renderMenu(){
  applyI18n();
  document.querySelectorAll('.age').forEach(b=>b.classList.toggle('sel',+b.dataset.age===S.menuAge));
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('sel',b.dataset.l===S.lang));
  const sb=$('startBtn');sb.disabled=!S.menuAge;sb.textContent=S.menuAge?L().start:L().pick;
  const cb=$('contBtn');
  if(saved&&saved.age){cb.style.display='block';cb.textContent=L().cont(L().ages[[3,6,9].indexOf(saved.age)],saved.level);}else cb.style.display='none';
}
document.querySelectorAll('.age').forEach(b=>b.onclick=()=>{sfx.click();S.menuAge=+b.dataset.age;renderMenu();});
document.querySelectorAll('.lang').forEach(b=>b.onclick=()=>{sfx.click();S.lang=b.dataset.l;save();renderMenu();});
$('startBtn').onclick=()=>{if(!S.menuAge)return;sfx.whoosh();Object.assign(S,{age:S.menuAge,level:1,score:0,q:0,streak:0,hearts:3});save();showGame();};
$('contBtn').onclick=()=>{sfx.whoosh();Object.assign(S,{age:saved.age,level:saved.level||1,score:saved.score||0,q:Math.min(saved.q||0,Q_PER_LEVEL-1),streak:0,hearts:3});showGame();};

function showGame(){$('menu').classList.remove('show');$('game').classList.add('show');applyI18n();loadQ();}
function goMenu(){stopTimer();save();S.menuAge=S.age;$('game').classList.remove('show');$('menu').classList.add('show');renderMenu();}
$('homeBtn').onclick=()=>{sfx.click();goMenu();};
$('langBtn').onclick=()=>{sfx.click();S.lang=LANGS[(LANGS.indexOf(S.lang)+1)%3];save();applyI18n();renderPrompt();updateStats();updateNext();};
$('sndBtn').onclick=()=>{S.sound=!S.sound;$('sndBtn').textContent=S.sound?'🔊':'🔇';if(S.sound)sfx.click();save();};

// ════════════════ RENDER ════════════════
function tokEl(tok){
  const el=document.createElement('div');el.className='tok';
  if(tok.t==='e'){el.textContent=tok.v;}
  else if(tok.t==='n'||tok.t==='l'){el.classList.add(tok.t==='n'?'num':'let');const d=String(tok.v).length;el.style.setProperty('--nf',d<=2?.5:d===3?.42:d===4?.34:d===5?.28:.24);el.textContent=tok.v;}
  else if(tok.t==='s'){const sp=document.createElement('span');sp.className='sz'+tok.s;sp.textContent=tok.e;el.appendChild(sp);}
  else if(tok.t==='g'){el.classList.add('grp');const n=tok.n,gc=n<=3?n:n===4?2:n<=6?3:n<=9?3:4,rows=Math.ceil(n/gc);
    const gi=document.createElement('div');gi.className='gin';gi.style.setProperty('--gc',gc);gi.style.setProperty('--gf',Math.min(.55,.86/Math.max(gc,rows)));
    for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=tok.e;gi.appendChild(s);}el.appendChild(gi);}
  return el;
}
function renderPrompt(){
  if(!S.cur)return;const t=S.cur.type,k=t.startsWith('rep')?'rep':t;
  $('prompt').textContent=L().prompts[k];$('band').textContent=L().bands[bandOf(S.cur.D)];
  $('chl').textContent=L().pickOne;
}
function renderDots(){const d=$('dots');d.innerHTML='';for(let i=0;i<Q_PER_LEVEL;i++){const x=document.createElement('div');x.className='dot'+(i<S.q?' done':i===S.q&&!S.solved?' now':'');d.appendChild(x);}}
function renderHearts(){$('hearts').innerHTML=[0,1,2].map(i=>`<span class="${i<S.hearts?'':'lost'}">❤️</span>`).join('');}
function updateStats(){$('lvlV').textContent=S.level;$('scoreV').textContent=S.score;$('streakV').textContent=S.streak;$('bestV').textContent=S.best;renderHearts();}
function updateNext(){const b=$('nextBtn');const on=S.solved&&S.q<Q_PER_LEVEL;b.classList.toggle('on',on);b.textContent=S.solved?(S.q>=Q_PER_LEVEL?L().levelDone:L().next):L().locked;}
function renderSeq(){
  const box=$('seq');box.innerHTML='';
  S.cur.seq.forEach((tok,i)=>{
    if(tok.t==='sep'){const s=document.createElement('div');s.className='sep';box.appendChild(s);return;}
    const bi=S.cur.blanks.indexOf(i);let el;
    if(bi>=0){el=document.createElement('div');el.className='tok blank'+(bi===S.ptr?' active':'');el.textContent='?';}
    else el=tokEl(tok);
    el.dataset.i=i;el.style.animationDelay=(i*0.03)+'s';box.appendChild(el);
  });
}
function renderChoices(){
  const box=$('choices');box.innerHTML='';const n=S.cur.choices.length;
  box.style.setProperty('--cols',n<=4?n:n<=6?3:4);
  S.cur.choices.forEach((tok,i)=>{const b=document.createElement('button');b.className='choice';b.appendChild(tokEl(tok));b.onclick=()=>onChoice(tok,b);box.appendChild(b);});
}
function layout(){
  if(!S.cur)return;
  const sq=$('seq'),w=sq.clientWidth||320;
  const items=S.cur.seq.filter(t=>t.t!=='sep').length+(S.cur.seq.some(t=>t.t==='sep')?0.5:0);
  const wide=S.cur.seq.some(t=>t.t==='g'&&t.n>4)||S.cur.seq.some(t=>t.t==='n'&&String(t.v).length>3);
  const per=Math.min(Math.ceil(items),Math.max(4,Math.floor(w/(wide?62:46))));
  sq.style.setProperty('--ts',Math.max(30,Math.min(64,Math.floor((w-6*(per-1))/per/(wide?1.25:1))))+'px');
  const ch=$('choices'),cols=parseInt(getComputedStyle(ch).getPropertyValue('--cols'))||4,cw=(ch.clientWidth-10*(cols-1))/cols;
  ch.style.setProperty('--ts',Math.max(34,Math.min(96,Math.floor(cw*.8)))+'px');
}
window.addEventListener('resize',layout);

// ════════════════ GAME FLOW ════════════════
function loadQ(){
  S.cur=genQuestion(S.age,S.level,S.q);S.ptr=0;S.solved=false;
  const c=$('card');c.classList.remove('pop','shake');void c.offsetWidth;c.classList.add('pop');
  renderPrompt();renderDots();renderSeq();renderChoices();updateStats();updateNext();
  setFb('','');requestAnimationFrame(layout);startTimer();
}
function setFb(txt,cls){const f=$('fb');f.textContent=txt;f.className='fb '+cls;}
function onChoice(tok,btn){
  if(S.solved||S.ov)return;ac();
  const want=S.cur.answers[S.ptr];
  if(key(tok)===key(want)){
    const idx=S.cur.blanks[S.ptr],old=$('seq').querySelector(`[data-i="${idx}"]`),el=tokEl(want);
    el.classList.add('filled');el.dataset.i=idx;old.replaceWith(el);
    btn.classList.add('right');setTimeout(()=>btn.classList.remove('right'),350);
    stars(btn);S.ptr++;
    document.querySelectorAll('.choice').forEach(b=>{b.disabled=false;b.classList.remove('wrong');});
    if(S.ptr>=S.cur.answers.length){solved();}
    else{sfx.fill();setFb(L().fillNext,'info');const nx=$('seq').querySelector(`[data-i="${S.cur.blanks[S.ptr]}"]`);if(nx)nx.classList.add('active');}
  }else{
    S.streak=0;S.hearts--;btn.classList.add('wrong');btn.disabled=true;sfx.bad();
    const c=$('card');c.classList.remove('shake','pop');void c.offsetWidth;c.classList.add('shake');
    setFb(pickMsg(L().wrong),'bad');updateStats();
    if(S.hearts<=0){stopTimer();setTimeout(gameOver,550);}
  }
}
let msgI=0;function pickMsg(a){msgI++;return a[msgI%a.length];}
function solved(){
  S.solved=true;stopTimer();
  const gain=10+Math.floor(S.cur.D*5)+S.streak*2+Math.floor(S.tLeft/2);
  S.score+=gain;S.streak++;S.best=Math.max(S.best,S.score);S.q++;
  sfx.ok();setFb(pickMsg(L().correct)+'  +'+gain,'ok');
  if(S.streak%3===0)confetti(30);
  updateStats();renderDots();updateNext();
  if(S.q>=Q_PER_LEVEL)setTimeout(levelUp,900);
  save();
}
function levelUp(){
  const oldD=getD(S.age,S.level);S.level++;S.q=0;S.hearts=3;save();
  const D=getD(S.age,S.level),lines=[];
  if(bandOf(D)>bandOf(oldD))lines.push(L().newRange(L().bands[bandOf(D)]));
  TYPES.filter(t=>t.min>oldD&&t.min<=D).forEach(t=>lines.push(L().newType(L().types[t.id])));
  lines.push(L().timeInfo(levelTime(D)));
  sfx.lvl();confetti(60);
  overlay(['🎉','🚀','⭐','🏆','🌈','🧠','💎','🦄'][S.level%8],L().lvlUp,L().lvlSub(S.level),lines.join('\n'),L().go,loadQ);
}
function gameOver(){sfx.over();S.hearts=3;S.q=0;S.streak=0;save();overlay('💔',L().noHearts,L().noHeartsSub,'',L().replay,loadQ);}
function onTimeout(){
  S.streak=0;S.hearts--;updateStats();sfx.timeout();
  if(S.hearts<=0){setTimeout(gameOver,300);return;}
  overlay('⏰',L().timeUp,L().timeUpSub,'',L().retry,loadQ);
}
function overlay(e,t,s,x,b,cb){
  S.ov=true;$('ovE').textContent=e;$('ovT').textContent=t;$('ovS').textContent=s;$('ovX').textContent=x;$('ovB').textContent=b;
  $('ov').classList.add('show');$('ovB').onclick=()=>{sfx.click();$('ov').classList.remove('show');S.ov=false;cb();};
}
$('nextBtn').onclick=()=>{if(!S.solved||S.q>=Q_PER_LEVEL||S.ov)return;sfx.whoosh();loadQ();};

// ════════════════ TIMER ════════════════
function startTimer(){
  stopTimer();S.tMax=levelTime(S.cur.D);S.tLeft=S.tMax;let lastSec=Math.ceil(S.tLeft);drawTimer();
  S.timer=setInterval(()=>{
    if(S.ov||S.solved||document.hidden)return;
    S.tLeft=Math.max(0,S.tLeft-0.1);const sec=Math.ceil(S.tLeft);
    if(sec!==lastSec){lastSec=sec;if(sec<=5&&sec>0)sfx.tick();}
    drawTimer();if(S.tLeft<=0){stopTimer();onTimeout();}
  },100);
}
function stopTimer(){clearInterval(S.timer);S.timer=null;}
function drawTimer(){const p=S.tLeft/S.tMax*100,f=$('tFill');f.style.width=p+'%';f.className='fill'+(p<=25?' danger':p<=50?' warn':'');$('tV').textContent=Math.ceil(S.tLeft)+'s';}

// ════════════════ EFFECTS ════════════════
function stars(el){
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  ['⭐','✨','💫','🌟','✨','⭐'].forEach((e,i)=>{const s=document.createElement('div');s.className='pt';s.textContent=e;
    const a=i/6*Math.PI*2+Math.random()*.5,d=60+Math.random()*70;
    s.style.cssText=`left:${x-10}px;top:${y-10}px;font-size:${1+Math.random()*.7}rem;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),950);});
}
function confetti(n){
  const c=['#FF6B9D','#FFD93D','#3CC36E','#4FB8FF','#9B5CFF','#FF9F43'];
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='cf';const sz=6+Math.random()*8;
    d.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*(.6+Math.random())}px;background:${c[i%6]};border-radius:${Math.random()<.5?'50%':'2px'};--x:${Math.random()*160-80}px;--d:${1.4+Math.random()*1.4}s;animation-delay:${Math.random()*.3}s`;
    document.body.appendChild(d);setTimeout(()=>d.remove(),3200);}
}

// keyboard: 1-8 choose, Enter = next
document.addEventListener('keydown',e=>{
  if(!$('game').classList.contains('show'))return;
  if(e.key==='Enter'){if(S.ov)$('ovB').click();else $('nextBtn').click();return;}
  const n=parseInt(e.key);if(n>=1&&n<=8){const b=document.querySelectorAll('.choice')[n-1];if(b&&!b.disabled)b.click();}
});

// ════════════════ INIT ════════════════
(function init(){
  const s=readSave();if(s){S.lang=s.lang||'en';S.sound=s.sound!==false;S.best=s.best||0;saved=s.age?s:null;S.menuAge=s.age||null;}
  $('sndBtn').textContent=S.sound?'🔊':'🔇';renderMenu();
})();
</script>
