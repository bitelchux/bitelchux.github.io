<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🦄 Oh Unicorn!</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@800&display=swap');

/* ── CONFIG ── */
:root {
  --bg:    #e0f2fe;
  --hud:   #a855f7;
  --huds:  #7e22ce;
  --path0: #fdf4ff;
  --path1: #f0abfc;
  --green: #34d399;
  --blue:  #60a5fa;
  --pink:  #f9a8d4;
  --yell:  #fde68a;
  --text:  #1e1b4b;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; touch-action:none; user-select:none; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100dvh; width: 100dvw;
  overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}

/* ════════════ SCREENS ════════════ */
.screen { display:none; position:absolute; inset:0; align-items:center; justify-content:center; flex-direction:column; }
.screen.on { display:flex; }

/* ════════════ TITLE ════════════ */
#sTitle {
  background: linear-gradient(160deg,#fdf4ff 0%,#e0f2fe 30%,#f0fdf4 60%,#fff7ed 85%,#fdf4ff 100%);
  gap: 10px; padding: 24px;
  animation: bgShift 8s ease-in-out infinite alternate;
}
@keyframes bgShift {
  0%   { filter: hue-rotate(0deg) brightness(1); }
  50%  { filter: hue-rotate(15deg) brightness(1.04); }
  100% { filter: hue-rotate(-10deg) brightness(1.02); }
}

.t-face { font-size: clamp(70px,15vw,120px); animation: spin 3s ease-in-out infinite; display:block;
  filter: drop-shadow(0 0 18px rgba(168,85,247,0.5)) drop-shadow(0 0 36px rgba(251,191,36,0.3)); }
@keyframes spin { 0%,100%{transform:rotate(-6deg) scale(1)} 50%{transform:rotate(6deg) scale(1.14)} }

.t-name {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(36px,9vw,88px);
  background: linear-gradient(90deg, #f472b6,#fb923c,#facc15,#4ade80,#60a5fa,#a78bfa,#f472b6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  filter: drop-shadow(2px 3px 0 rgba(0,0,0,0.10));
  animation: rainbow 2.5s linear infinite;
  background-size: 200% auto;
}
@keyframes rainbow { to { background-position: 200% center; } }

.t-sub { font-family:'Fredoka One',cursive; font-size:clamp(12px,2.8vw,18px); color:#7c3aed; letter-spacing:3px; }

.t-btns { display:flex; flex-direction:column; gap:10px; width:min(240px,78%); margin-top:14px; }

/* ════════════ BUTTONS ════════════ */
.btn {
  font-family:'Fredoka One',cursive; font-size:clamp(15px,3.2vw,20px);
  padding:12px 28px; border:none; border-radius:50px; cursor:pointer;
  transition:transform .12s, box-shadow .12s; letter-spacing:1px;
}
.btn:active { transform:scale(0.92) translateY(3px)!important; box-shadow:none!important; }
.btn-r  { background:#f472b6; color:#fff; box-shadow:0 5px 0 #be185d; }
.btn-r:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #be185d; }
.btn-y  { background:#facc15; color:#713f12; box-shadow:0 5px 0 #ca8a04; }
.btn-y:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #ca8a04; }
.btn-g  { background:#4ade80; color:#fff; box-shadow:0 5px 0 #15803d; }
.btn-g:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #15803d; }
.btn-b  { background:#60a5fa; color:#fff; box-shadow:0 5px 0 #1d4ed8; }
.btn-b:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #1d4ed8; }
.btn-p  { background:#a78bfa; color:#fff; box-shadow:0 5px 0 #6d28d9; }
.btn-p:hover  { transform:translateY(-2px); box-shadow:0 7px 0 #6d28d9; }
.btn-ghost { background:transparent; color:#7c3aed; border:2.5px solid #7c3aed; box-shadow:none; }
.btn-ghost:hover { background:rgba(124,58,237,.08); }

/* ════════════ HUD ════════════ */
#hud {
  position:fixed; top:0; left:0; right:0; z-index:200;
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  padding:5px 10px;
  background: linear-gradient(90deg,#a855f7,#ec4899,#f97316,#eab308,#22c55e,#3b82f6,#a855f7);
  background-size: 300% auto;
  animation: hudRainbow 4s linear infinite;
  box-shadow: 0 3px 0 #6b21a8;
}
@keyframes hudRainbow { to { background-position: 300% center; } }
.hpill {
  display:flex; align-items:center; gap:4px;
  background:rgba(255,255,255,0.28); border-radius:20px; padding:3px 9px;
  font-family:'Fredoka One',cursive; font-size:clamp(11px,2.2vw,15px); color:#fff;
  text-shadow: 0 1px 3px rgba(0,0,0,0.3);
}
.hpill .lbl { font-size:.68em; opacity:.8; }
.hpill .val { color:#fef9c3; }
#hLives { background:none; padding:0; gap:1px; }
.hlife { font-size:clamp(13px,2.3vw,17px); transition:all .3s; }
.hlife.lost { filter:grayscale(1) opacity(.3); }
#hPU { gap:3px; }
.hpu { font-size:16px; }
#dbgBadge { display:none; background:rgba(220,38,38,.85); border-radius:20px; padding:3px 9px; font-family:'Fredoka One',cursive; font-size:11px; color:#fff; }

/* ════════════ GAME SCREEN ════════════ */
#sGame { background:var(--bg); flex-direction:column; padding-top:42px; }
#gameArea { flex:1; display:flex; align-items:center; justify-content:center; width:100%; overflow:hidden; }
#cv { display:block; }

/* ════════════ OVERLAY D-PAD (touch devices without physical keyboard) ════════════ */
/* Two separate pads: left side and right side, both semi-transparent */
#dpadL, #dpadR {
  display:none;
  position:fixed; bottom:clamp(16px,5vh,40px); z-index:200;
  opacity:0.38; transition:opacity .18s;
  pointer-events:auto;
}
#dpadL { left:clamp(6px,2vw,18px); }
#dpadR { right:clamp(6px,2vw,18px); }
#dpadL:active, #dpadR:active,
#dpadL.touched, #dpadR.touched { opacity:0.82; }

.dp {
  display:grid;
  grid-template-columns:52px 52px 52px;
  grid-template-rows:52px 52px 52px;
  gap:5px;
}
.dpb {
  background:rgba(255,255,255,0.65);
  border:2.5px solid rgba(167,139,250,0.8);
  border-radius:14px;
  font-size:22px; display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  box-shadow:0 3px 0 rgba(109,40,217,0.4);
  backdrop-filter:blur(4px);
  transition:all .1s;
  -webkit-backdrop-filter:blur(4px);
}
.dpb:active { box-shadow:none; transform:translateY(3px); background:rgba(167,139,250,0.5); }
.dp-center {
  background:rgba(253,244,255,0.5);
  border:2px dashed rgba(167,139,250,0.5);
  border-radius:14px;
  font-size:18px; display:flex; align-items:center; justify-content:center;
}

/* ════════════ OVERLAYS ════════════ */
.ov {
  position:fixed; inset:0; background:rgba(30,0,60,.5); backdrop-filter:blur(6px);
  z-index:300; display:none; align-items:center; justify-content:center; flex-direction:column; gap:12px;
}
.ov.on { display:flex; animation:fadeIn .3s; }
.ovbox {
  background:linear-gradient(135deg,#fdf4ff,#eff6ff);
  border:4px solid #a855f7; border-radius:28px;
  padding:clamp(16px,4vw,36px); text-align:center; max-width:340px; width:90%;
  box-shadow:0 7px 0 #6b21a8, 0 16px 40px rgba(80,0,120,.25);
  animation:popIn .32s cubic-bezier(.34,1.56,.64,1);
}
.ovtitle { font-family:'Fredoka One',cursive; font-size:clamp(22px,5vw,38px); color:#7c3aed; margin-bottom:5px; }
.ovsub   { font-size:clamp(12px,2.3vw,15px); color:#6b7280; margin-bottom:10px; }
.ovbtns  { display:flex; gap:9px; flex-wrap:wrap; justify-content:center; margin-top:9px; }

/* ════════════ PHASE OVERLAY ════════════ */
#phaseOv {
  position:fixed; inset:0; z-index:400; display:none; pointer-events:none;
  align-items:center; justify-content:center; flex-direction:column; gap:8px;
}
#phaseOv.on { display:flex; }
.phBig  { font-size:80px; animation:phasePop .5s cubic-bezier(.34,1.56,.64,1); filter:drop-shadow(0 0 20px rgba(168,85,247,0.7)); }
.phText {
  font-family:'Fredoka One',cursive; font-size:clamp(20px,6vw,46px);
  background: linear-gradient(90deg,#f472b6,#fb923c,#facc15,#4ade80,#60a5fa,#a78bfa);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-size:200% auto; animation:rainbow 1.5s linear infinite, phasePop .5s cubic-bezier(.34,1.56,.64,1) .06s both;
  filter: drop-shadow(2px 2px 0 rgba(0,0,0,0.15));
}

/* ════════════ FLOAT SCORE ════════════ */
.fscore {
  position:fixed; font-family:'Fredoka One',cursive; font-size:clamp(14px,3.5vw,22px);
  pointer-events:none; z-index:500; animation:floatUp 1.1s ease-out forwards;
  text-shadow:1px 1px 0 rgba(0,0,0,.2);
}

/* ════════════ LEVEL SELECT ════════════ */
#sLevels {
  background:linear-gradient(160deg,#fdf4ff,#e0f2fe 40%,#f0fdf4 80%,#fff7ed);
  justify-content:flex-start; padding:12px 0 20px; overflow-y:auto;
}
.lvl-h { font-family:'Fredoka One',cursive; font-size:clamp(20px,5vw,32px); color:#7c3aed; margin:6px 0 10px; }
.lvl-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:5px; max-width:560px; width:94%; margin:0 auto; }
.lvlbtn {
  aspect-ratio:1; border-radius:12px; border:3px solid #e9d5ff; background:#fdf4ff;
  font-family:'Fredoka One',cursive; font-size:clamp(9px,1.6vw,12px); color:#6b7280;
  cursor:pointer; transition:all .14s; display:flex; align-items:center; justify-content:center;
  flex-direction:column; gap:1px; box-shadow:0 3px 0 #c4b5fd;
}
.lvlbtn .lem { font-size:clamp(10px,2.2vw,16px); }
.lvlbtn.done { border-color:#4ade80; background:#f0fdf4; color:#14532d; box-shadow:0 3px 0 #15803d; }
.lvlbtn.open { border-color:#a78bfa; background:#f5f3ff; color:#4c1d95; box-shadow:0 3px 0 #6d28d9; }
.lvlbtn.open:hover { transform:translateY(-2px) scale(1.07); }
.lvlbtn.locked { opacity:.3; cursor:not-allowed; box-shadow:none; }

/* ════════════ SCORES ════════════ */
#sScores {
  background:linear-gradient(160deg,#fdf4ff,#e0f2fe 40%,#f0fdf4);
  gap:8px; padding:16px 12px;
}
.sc-row {
  display:flex; align-items:center; gap:8px; font-size:clamp(12px,2.3vw,15px);
  padding:9px 14px; border-radius:14px; width:min(340px,92%);
  background:#fdf4ff; border:2px solid #e9d5ff; box-shadow:0 3px 0 #c4b5fd;
}
.sc-pos { font-family:'Fredoka One',cursive; font-size:1.2em; min-width:26px; }
.sc-pts { font-family:'Fredoka One',cursive; color:#7c3aed; margin-left:auto; }

/* ════════════ HOW TO ════════════ */
#sHow {
  background:linear-gradient(160deg,#fdf4ff,#e0f2fe 40%,#f0fdf4);
  gap:9px; padding:14px;
}
.how-card { background:#fdf4ff; border:2.5px solid #c4b5fd; border-radius:16px; padding:12px 16px; width:min(360px,95%); box-shadow:0 3px 0 #7c3aed44; }
.how-t { font-family:'Fredoka One',cursive; font-size:clamp(14px,3vw,19px); color:#7c3aed; margin-bottom:5px; }
.how-b { font-size:clamp(11px,2.3vw,14px); color:#374151; line-height:1.55; }

/* ════════════ ANIMATIONS ════════════ */
@keyframes fadeIn  { from{opacity:0} to{opacity:1} }
@keyframes popIn   { from{opacity:0;transform:scale(.45)} to{opacity:1;transform:scale(1)} }
@keyframes phasePop{ from{opacity:0;transform:scale(.2) rotate(-15deg)} to{opacity:1;transform:scale(1) rotate(0)} }
@keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-72px) scale(1.3)} }
@keyframes shake   { 0%,100%{transform:translateX(0)} 25%,75%{transform:translateX(-7px)} 50%{transform:translateX(7px)} }

.langBtn.active { outline: 3px solid #a855f7; outline-offset: 2px; transform: scale(1.08); }

@media (max-width:600px),(hover:none) {
  /* dpad visibility now controlled by JS based on touch-only detection */
}
</style>
</head>
<body>

<!-- ══════════ TITLE ══════════ -->
<div class="screen on" id="sTitle">
  <span class="t-face">🦄</span>
  <div class="t-name" id="tName">Oh Unicorn!</div>
  <div class="t-sub" id="tSub">🌈 ¡Rodea las nubes! 🌈</div>
  <!-- Language switcher -->
  <div style="display:flex;gap:7px;margin:6px 0">
    <button class="btn langBtn" data-lang="es" onclick="setLang('es')" style="padding:5px 13px;font-size:13px;background:#fdf4ff;color:#7c3aed;box-shadow:0 3px 0 #c4b5fd;border:none;border-radius:20px;cursor:pointer;font-family:'Fredoka One',cursive">🇪🇸 ES</button>
    <button class="btn langBtn" data-lang="en" onclick="setLang('en')" style="padding:5px 13px;font-size:13px;background:#e0f2fe;color:#1d4ed8;box-shadow:0 3px 0 #93c5fd;border:none;border-radius:20px;cursor:pointer;font-family:'Fredoka One',cursive">🇬🇧 EN</button>
    <button class="btn langBtn" data-lang="fr" onclick="setLang('fr')" style="padding:5px 13px;font-size:13px;background:#f0fdf4;color:#15803d;box-shadow:0 3px 0 #86efac;border:none;border-radius:20px;cursor:pointer;font-family:'Fredoka One',cursive">🇫🇷 FR</button>
  </div>
  <div class="t-btns">
    <button class="btn btn-p" id="btnPlay" onclick="goLevels()">🦄 JUGAR</button>
    <button class="btn btn-y" id="btnRecords" onclick="goScreen('sScores');buildScores()">🏆 RÉCORDS</button>
    <button class="btn btn-b" id="btnHow" onclick="goScreen('sHow')">📖 CÓMO JUGAR</button>
  </div>
  <div id="tAutosave" style="margin-top:10px;font-size:11px;color:#a78bfa">💾 Progreso guardado automáticamente</div>
</div>

<!-- ══════════ HOW TO ══════════ -->
<div class="screen" id="sHow">
  <div id="howTitle" style="font-family:'Fredoka One',cursive;font-size:clamp(20px,5vw,30px);color:#7c3aed;margin:14px 0 4px">📖 Cómo jugar</div>
  <div class="how-card"><div class="how-t" id="h1t">🎯 Objetivo</div><div class="how-b" id="h1b"></div></div>
  <div class="how-card"><div class="how-t" id="h2t">🕹️ Controles</div><div class="how-b" id="h2b"></div></div>
  <div class="how-card"><div class="how-t" id="h3t">⚡ Power-ups</div><div class="how-b" id="h3b"></div></div>
  <div class="how-card"><div class="how-t" id="h4t">😈 Enemigos</div><div class="how-b" id="h4b"></div></div>
  <button class="btn btn-ghost backBtn" style="margin-top:8px" onclick="goScreen('sTitle')">↩ Volver</button>
</div>

<!-- ══════════ LEVELS ══════════ -->
<div class="screen" id="sLevels">
  <div class="lvl-h" id="chooseLvl">🗺️ Elige nivel</div>
  <div class="lvl-grid" id="lvlGrid"></div>
  <button class="btn btn-ghost backBtn" style="margin:12px 0" onclick="goScreen('sTitle')">↩ Volver</button>
</div>

<!-- ══════════ SCORES ══════════ -->
<div class="screen" id="sScores">
  <div style="font-family:'Fredoka One',cursive;font-size:clamp(20px,5vw,30px);color:#7c3aed;margin:16px 0 6px">🏆</div>
  <div id="scoreList" style="display:flex;flex-direction:column;gap:6px;width:100%;align-items:center;overflow-y:auto;max-height:70vh;padding:0 8px"></div>
  <button class="btn btn-ghost backBtn" style="margin:12px 0" onclick="goScreen('sTitle')">↩ Volver</button>
</div>

<!-- ══════════ GAME ══════════ -->
<div class="screen" id="sGame">
  <div id="hud">
    <div class="hpill"><span class="lbl" id="hLvlLbl">LVL</span><span class="val" id="hLvl">1</span></div>
    <div class="hpill" id="hLives"></div>
    <div class="hpill"><span class="lbl" id="hScoreLbl">⭐</span><span class="val" id="hScore">0</span></div>
    <div class="hpill"><span class="lbl" id="hTimeLbl">⏱</span><span class="val" id="hTime">0s</span></div>
    <div class="hpill" id="hPU"></div>
    <div id="dbgBadge">🐛 DEBUG</div>
  </div>
  <div id="gameArea"><canvas id="cv"></canvas></div>
</div>

<!-- LEFT D-PAD: full 4-dir (redundant ← → both sides) -->
<div id="dpadL">
  <div class="dp">
    <div></div>              <div class="dpb" id="bU">⬆️</div>  <div></div>
    <div class="dpb" id="bL">⬅️</div> <div class="dp-center">😶</div> <div class="dpb" id="bLR">➡️</div>
    <div></div>              <div class="dpb" id="bD">⬇️</div>  <div></div>
  </div>
</div>
<!-- RIGHT D-PAD: full 4-dir (redundant ← → both sides) -->
<div id="dpadR">
  <div class="dp">
    <div></div>               <div class="dpb" id="bU2">⬆️</div>  <div></div>
    <div class="dpb" id="bRL">⬅️</div> <div class="dp-center">😶</div> <div class="dpb" id="bR">➡️</div>
    <div></div>               <div class="dpb" id="bD2">⬇️</div>  <div></div>
  </div>
</div>

<!-- OVERLAYS -->
<div class="ov" id="ovPause">
  <div class="ovbox">
    <div class="ovtitle" id="ovPauseTitle">⏸️ Pausa</div>
    <div class="ovbtns">
      <button class="btn btn-g" id="btnResume" onclick="resumeGame()">▶️ Continuar</button>
      <button class="btn btn-ghost" id="btnMenuP" onclick="quitGame()">🏠 Menú</button>
    </div>
  </div>
</div>
<div class="ov" id="ovWin">
  <div class="ovbox">
    <div class="ovtitle" id="ovWinTitle">🎉 ¡Genial!</div>
    <div class="ovsub" id="ovWinScore"></div>
    <div class="ovsub" id="ovWinBonus" style="color:#6bcb77;font-weight:700"></div>
    <div class="ovbtns">
      <button class="btn btn-g" id="btnNext" onclick="nextLevel()">➡️ Siguiente</button>
      <button class="btn btn-ghost" id="btnMenuW" onclick="quitGame()">🏠 Menú</button>
    </div>
  </div>
</div>
<div class="ov" id="ovDead">
  <div class="ovbox">
    <div class="ovtitle" id="ovDeadTitle">💀 ¡Atrapado!</div>
    <div class="ovsub" id="ovDeadScore"></div>
    <div class="ovsub" id="ovDeadLvl"></div>
    <div class="ovbtns">
      <button class="btn btn-r" id="btnRetry" onclick="retryLevel()">🔄 Reintentar</button>
      <button class="btn btn-ghost" id="btnMenuD" onclick="quitGame()">🏠 Menú</button>
    </div>
  </div>
</div>
<div id="phaseOv">
  <div class="phBig" id="phFace">😶</div>
  <div class="phText" id="phTxt">Nivel 1</div>
</div>

<!-- ══════════════════════════════════════ JS ══════════════════════════════════════ -->
<script>
'use strict';

// ╔═══════════════════════════════════════════════╗
// ║  CONFIGURACIÓN — editar antes de publicar     ║
// ╠═══════════════════════════════════════════════╣
var FORCE_DEBUG = false; // ← true = todos los niveles desbloqueados sin URL
var DEFAULT_LANG = 'en'; // ← 'es' | 'en' | 'fr'
// ╚═══════════════════════════════════════════════╝

// ── I18N ──
const LANGS = {
  es: {
    title:'Oh Unicorn!', sub:'🌈 ¡Rodea las nubes! 🌈',
    play:'🦄 JUGAR', records:'🏆 RÉCORDS', howto:'📖 CÓMO JUGAR',
    autosave:'💾 Progreso guardado automáticamente',
    howTitle:'📖 Cómo jugar',
    h1t:'🎯 Objetivo', h1b:'Rodea cada nube ☁️ caminando por sus <b>4 lados</b> completos. ¡Cuando la rodees entera aparece un arcoíris!',
    h2t:'🕹️ Controles', h2b:'⌨️ Flechas o WASD para moverte.<br>📱 Botones en pantalla o desliza con el dedo.',

    h4t:'😈 Enemigos', h4b:'Demonios, escorpiones 🦂, serpientes 🐍 y calaveras 💀 te persiguen: cuanto más avanzas, más rápidos son. Si te ven de frente, ¡aceleran! Las calaveras y los fantasmas 👻 (niveles finales) se teletransportan, y los fantasmas además atraviesan las nubes.',
    back:'↩ Volver', chooseLvl:'🌈 Elige nivel', noScores:'Aún no hay puntuaciones 🦄',
    lvlLabel:'Nivel', lvlHud:'LVL', scoreHud:'🌈', timeHud:'⏱',

// minLevel: nivel a partir del cual puede aparecer.
// speedMul: multiplica la velocidad base del enemigo (cfg.mRatio).
// chaseChance: probabilidad de moverse hacia el jugador en vez de al azar.
// sight: si existe, el enemigo "ve" al jugador cuando está alineado en su

//   dura `boostDur` segundos tras verlo, corre `boost` veces más rápido.
// teleport: si existe, cada X segundos (entre cooldownMin y cooldownMax)

// Elige un tipo de enemigo disponible en `lvl`, dando más peso a los tipos
// cuanto más se ha superado su nivel mínimo de aparición (así los tipos
// nuevos empiezan siendo raros y se vuelven habituales más adelante).
function pickEnemyType(lvl){
  const pool=[];
  for(const key in ENEMY_TYPES){
    const t=ENEMY_TYPES[key];
    if(lvl<t.minLevel) continue;
    const w=Math.max(1, Math.round((lvl-t.minLevel)/8)+1);
    for(let i=0;i<w;i++) pool.push(key);
  }
  return pool[Math.floor(Math.random()*pool.length)] || 'imp';
}

const rand=(a,b)=>a+Math.random()*(b-a);

// ── ORIENTACIÓN POR DEFECTO DE CADA SPRITE ──
// Hacia dónde "mira" el emoji tal cual, sin transformar. Cámbialo aquí si
// usas otros emojis: el resto del código calcula solo la transformación
// (giro 90º o espejo) necesaria para que mire hacia donde se mueve.
const DEFAULT_FACING = {
  player:   'LEFT', // 🦄 mira a la derecha por defecto
  imp:      'DOWN',  // 😈 👿
  scorpion: 'DOWN',  // 🦂
  snake:    'DOWN',  // 🐍
  skull:    'DOWN',  // 💀
  ghost:    'DOWN',  // 👻
};

// Ángulo horario (sentido de ctx.rotate) de cada dirección
const DIR_ANGLE = {RIGHT:0, DOWN:90, LEFT:180, UP:270};

// Calcula cómo transformar el emoji (rotación + espejo) para que pase de
// mirar su dirección "de fábrica" (DEFAULT_FACING) a mirar `dir`.
// - Si la dirección es la opuesta al defecto → se usa espejo (se ve más
//   natural que girar 180º y quedar boca abajo).
// - Si es perpendicular → se gira 90º/-90º.
function getFacingTransform(dir, spriteKey){
  if(!dir) return {rotate:0, flipH:false, flipV:false};
  const def = DEFAULT_FACING[spriteKey] || 'RIGHT';
  const diff = ((DIR_ANGLE[dir]-DIR_ANGLE[def])%360+360)%360;
  if(diff===0) return {rotate:0, flipH:false, flipV:false};
  if(diff===180){
    const defHoriz = def==='RIGHT'||def==='LEFT';
    return defHoriz ? {rotate:0,flipH:true,flipV:false} : {rotate:0,flipH:false,flipV:true};
  }
  return {rotate:(diff===90?1:-1)*Math.PI/2, flipH:false, flipV:false};
}

// ── AUDIO (Web Audio API — magical sparkle sounds) ──
let AC = null;
function getAC(){ if(!AC) try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}; return AC; }

function playTone(freq, type, dur, vol=0.15, delay=0, freqEnd=null){
  const ac=getAC(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.connect(g); g.connect(ac.destination);
  o.type=type;
  o.frequency.setValueAtTime(freq, ac.currentTime+delay);
  if(freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, ac.currentTime+delay+dur);
  g.gain.setValueAtTime(vol, ac.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+delay+dur);
  o.start(ac.currentTime+delay); o.stop(ac.currentTime+delay+dur+0.05);
}

// Shimmer: rapid high-freq sine bursts
function playShimmer(baseFreq, count, vol=0.07){
  for(let i=0;i<count;i++){
    const f=baseFreq*(1+Math.random()*0.4);
    playTone(f,'sine',0.06+Math.random()*0.06, vol, i*0.03);
  }
}

// Magic glissando — slides from freq1 to freq2
function glissando(f1, f2, dur, vol=0.14, delay=0){
  playTone(f1,'triangle',dur,vol,delay,f2);
}

// Level 1: 4 cols × 3 rows, 1 mummy
// Level 100: 12 cols × 9 rows, 8 mummies
// Linear interpolation
function getConfig(lvl){
  const t = (Math.min(lvl,100)-1)/99; // 0..1
  const isMob = isMobile();

  // Grid size — desktop: cols×rows, mobile portrait: swap to rows×cols
  const cols = Math.round(4  + t*(12-4));   // 4→12
  const rows = Math.round(3  + t*(9-3));    // 3→9

  const mummies  = Math.round(1 + t*(8-1)); // 1→8
  // Player steps/sec stays constant; mummy speed fraction increases
  const playerSPS = 4.5; // steps per second
  const mRatio    = 0.28 + t*0.72; // 0.28→1.0 of player speed

  const puChance = 0.10 + t*0.18; // 10%→28% chance per tomb

  // On mobile portrait, swap cols/rows so layout is taller than wide
  return isMob
    ? {lvl, cols:rows, rows:cols, mummies, playerSPS, mRatio, puChance}
    : {lvl, cols, rows,          mummies, playerSPS, mRatio, puChance};
}

function isMobile(){ return window.innerWidth < window.innerHeight || ('ontouchstart' in window && window.innerWidth < 700); }

// ── GRID STRUCTURE ──
// Each tomb occupies a 3×3 block of cells.
// Corridors are the 1-cell gaps between tombs and at the border.
// Grid cell (gx,gy) where:
//   gx = 0 .. cols*4     (cols tombs → each needs 3 cells + 1 corridor)
//   gy = 0 .. rows*4
// Cell type: 0=corridor/path, 1=tomb interior
// Tomb at grid-slot (tc,tr) occupies pixel cells (tc*4+1, tr*4+1) to (tc*4+3, tr*4+3)

function buildGameGrid(cfg){
  const {cols,rows} = cfg;
  const GW = cols*4+1, GH = rows*4+1;
  // tomb interior: gx in [tc*4+1 .. tc*4+3], gy in [tr*4+1 .. tr*4+3]
  const isTombCell = (gx,gy) => gx>=1 && gy>=1 && (gx-1)%4<3 && (gy-1)%4<3;
  // Set of revealed tomb top-left corners (gx,gy) — cells become unwalkable after reveal
  const revealedTombCells = new Set(); // "gx,gy" of each interior cell when revealed
  // walkable = in bounds AND not an unrevealed tomb interior AND not a revealed tomb interior
  const walkable = (gx,gy) => {
    if(gx<0||gx>=GW||gy<0||gy>=GH) return false;
    if(isTombCell(gx,gy)) return false; // tomb interior always unwalkable (corridor only)
    return true; // corridors always walkable (revealed tombs don't open corridors)
  };

  // Build tomb list with contents
  const tombs = [];
  for(let tr=0;tr<rows;tr++){
    for(let tc=0;tc<cols;tc++){
      const gx=tc*4+1, gy=tr*4+1;
      let content;
      if(Math.random()<cfg.puChance){
        const pt=PU_TYPES[Math.floor(Math.random()*PU_TYPES.length)];
        content={emoji:PU[pt].emoji,pts:0,color:PU[pt].color,pu:pt};
      } else {
        const t=TREASURES[Math.floor(Math.random()*TREASURES.length)];
        content={emoji:t.e,pts:t.pts,color:t.c,pu:null};
      }
      tombs.push({
        tc,tr,gx,gy,
        sides:{top:false,bottom:false,left:false,right:false},
        visited:new Set(),
        revealed:false,content,revealT:0,
      });
    }
  }
  return {GW,GH,walkable,tombs};
}

// corridors adjacent to a tomb side (3 cells each)
function tombSideCells(t){
  const {gx,gy}=t;
  return {
    top:   [[gx,gy-1],[gx+1,gy-1],[gx+2,gy-1]],
    bottom:[[gx,gy+3],[gx+1,gy+3],[gx+2,gy+3]],
    left:  [[gx-1,gy],[gx-1,gy+1],[gx-1,gy+2]],
    right: [[gx+3,gy],[gx+3,gy+1],[gx+3,gy+2]],
  };
}

// ── CALC CELL SIZE ──
function calcCS(GW,GH){
  const aW = window.innerWidth;
  const aH = window.innerHeight - 44; // just HUD
  return Math.max(10, Math.floor(Math.min(aW/GW, aH/GH)));
}

// ── START GAME ──
function startGame(lvl){
  goScreen('sGame');
  const cfg = getConfig(lvl);
  const {GW,GH,walkable,tombs} = buildGameGrid(cfg);
  const cs = calcCS(GW,GH);
  cv.width=GW*cs; cv.height=GH*cs;

  // Player start: top-left corridor (0,0)
  const player = {
    cx:0, cy:0,
    px:cs*0.5, py:cs*0.5,
    tx:cs*0.5, ty:cs*0.5,
    ox:cs*0.5, oy:cs*0.5,
    moving:false, stepT:0,
    stepDur: 1/cfg.playerSPS,
    dir:null, activeDir:null, queueDir:null,
    alive:true, deathAnim:0,
    face:PLAYER_FACE,
    invincible:false, invTime:0,
  };

  // Mummies — start from various corners/edges
  const corners=[
    [GW-1,GH-1],[GW-1,0],[0,GH-1],
    [Math.floor(GW/2),GH-1],[GW-1,Math.floor(GH/2)],
    [0,Math.floor(GH/2)],[Math.floor(GW/2),0],
    [Math.floor(GW*3/4),GH-1],
  ];
  const mummies = Array.from({length:cfg.mummies},(_,i)=>{
    const [scx,scy]=corners[i%corners.length];
    // ensure walkable start
    const cx=scx, cy=scy;
    const typeKey=pickEnemyType(lvl);
    const type=ENEMY_TYPES[typeKey];
    const face=type.faces[Math.floor(Math.random()*type.faces.length)];
    const baseDur=1/(cfg.playerSPS*cfg.mRatio*type.speedMul);
    return {
      cx,cy,
      px:(cx+0.5)*cs, py:(cy+0.5)*cs,
      tx:(cx+0.5)*cs, ty:(cy+0.5)*cs,
      ox:(cx+0.5)*cs, oy:(cy+0.5)*cs,
      moving:false, stepT:0,
      stepDur: baseDur,
      baseDur,
      dir:'DOWN', id:i, face, type:typeKey,
      frozen:false, slow:false,
      dead:false, deathAnim:0,
      teleTimer: type.teleport ? rand(type.teleport.cooldownMin,type.teleport.cooldownMax) : Infinity,
      sightBoost:false, boostTimer:0,
    };
  });

  // Celdas de pasillo transitables — se usan como destinos de teletransporte
  const corridorCells=[];
  for(let y=0;y<GH;y++) for(let x=0;x<GW;x++) if(walkable(x,y)) corridorCells.push([x,y]);

  G = {
    cfg, lvl, cs, GW, GH, walkable, tombs, corridorCells,
    totalTombs:tombs.length, revealedTombs:0,
    player, mummies,
    lives:3, score:0, time:0,
    powerups:{}, particles:[],
    state:'playing', paused:false, lastTime:null,
    inputDir:null,
  };

  updateHUD(); updateLivesHUD(); updatePUHUD();
  if(DEBUG) document.getElementById('dbgBadge').style.display='flex';
  showPhase(`${T().lvlLabel} ${lvl}`, player.face, ()=>{
    G.state='playing';
    requestAnimationFrame(loop);
  });
}

// ── GAME LOOP ──
function loop(ts){
  if(!G||G.paused) return;
  if(G.lastTime===null) G.lastTime=ts;
  const dt=Math.min((ts-G.lastTime)/1000, 0.08);
  G.lastTime=ts;
  if(G.state!=='gameover') update(dt);
  render();
  if(G.state!=='gameover') requestAnimationFrame(loop);
}

// ── UPDATE ──
function update(dt){
  if(G.state==='dying'){
    G.player.deathAnim+=dt*2.5;
    if(G.player.deathAnim>=1){
      G.lives--;updateLivesHUD();
      if(G.lives<=0){ G.state='gameover'; setTimeout(showDead,350); }
      else respawn();
    }
    animMummies(dt); return;
  }
  if(G.state!=='playing') return;

  G.time+=dt;

  tickPU();
  stepPlayer(dt);
  stepMummies(dt);
  checkHit();
  checkWin();
  updateHUD();
}

// ── POWERUPS ──
function tickPU(){
  const now=Date.now();
  for(const [type,end] of Object.entries(G.powerups)){
    if(now>=end){
      delete G.powerups[type];
      if(type==='freeze') G.mummies.forEach(m=>{if(!m.dead)m.frozen=false;});
      if(type==='slow')   G.mummies.forEach(m=>{if(!m.dead){m.slow=false;m.stepDur=mummyStepDur(m);}});
      updatePUHUD();
    }
  }
  if(G.player.invincible){ G.player.invTime-=0.016; if(G.player.invTime<=0) G.player.invincible=false; }
}

// ── PLAYER MOVEMENT (tile-based, input-driven) ──
function stepPlayer(dt){
  const P=G.player;
  if(!P.alive) return;
  if(G.inputDir){ P.queueDir=G.inputDir; G.inputDir=null; }

  if(!P.moving){
    const want = P.queueDir || P.activeDir;
    if(!want) return;
    const nx=P.cx+DX[want], ny=P.cy+DY[want];
    if(G.walkable(nx,ny)){
      P.ox=P.px; P.oy=P.py;
      P.cx=nx; P.cy=ny;
      P.tx=(nx+0.5)*G.cs; P.ty=(ny+0.5)*G.cs;
      P.moving=true; P.stepT=0; P.dir=want; P.queueDir=null;
      SFX.step();
    } else {
      P.queueDir=null;
    }
  }
  if(P.moving){
    P.stepT=Math.min(1,P.stepT+dt/P.stepDur);
    const e=eio(P.stepT);
    P.px=lerp(P.ox,P.tx,e); P.py=lerp(P.oy,P.ty,e);
    if(P.stepT>=1){ P.px=P.tx; P.py=P.ty; P.moving=false; checkSides(); }
  }
}

// ── MUMMIES / ENEMIGOS ──
// Duración de paso real de un enemigo, combinando su velocidad base con
// la ralentización (power-up 🐢) y el sprint al detectar al jugador.
function mummyStepDur(m){
  let dur=m.baseDur;
  if(m.slow) dur*=3;
  if(m.sightBoost){ const s=ENEMY_TYPES[m.type].sight; if(s) dur/=s.boost; }
  return dur;
}
// ¿Puede el enemigo `m` pisar la celda (nx,ny)? Los fantasmas atraviesan
// el interior de las nubes; el resto solo puede moverse por los pasillos.
function mummyWalkable(m,nx,ny){
  if(nx<0||nx>=G.GW||ny<0||ny>=G.GH) return false;
  if(ENEMY_TYPES[m.type].canPhase) return true;
  return G.walkable(nx,ny);
}
// ¿Ve el enemigo al jugador? Solo si están alineados en fila/columna,
// dentro de su rango de visión y sin nada bloqueando el camino.
function mummySeesPlayer(m){
  const sight=ENEMY_TYPES[m.type].sight;
  if(!sight) return false;
  const P=G.player;
  if(m.cx===P.cx&&m.cy!==P.cy){
    if(Math.abs(m.cy-P.cy)>sight.range) return false;
    const step=P.cy>m.cy?1:-1;
    for(let y=m.cy+step;y!==P.cy;y+=step) if(!mummyWalkable(m,m.cx,y)) return false;
    return true;
  }
  if(m.cy===P.cy&&m.cx!==P.cx){
    if(Math.abs(m.cx-P.cx)>sight.range) return false;
    const step=P.cx>m.cx?1:-1;
    for(let x=m.cx+step;x!==P.cx;x+=step) if(!mummyWalkable(m,x,m.cy)) return false;
    return true;
  }
  return false;
}
// Teletransporta al enemigo a una celda de pasillo al azar (no demasiado
// cerca del jugador, para que siga siendo justo) — 💀 y 👻.
function teleportMummy(m){
  const cells=G.corridorCells; if(!cells||!cells.length) return;
  const P=G.player;
  let cell, tries=0;
  do{ cell=cells[Math.floor(Math.random()*cells.length)]; tries++; }
  while(tries<12 && Math.abs(cell[0]-P.cx)+Math.abs(cell[1]-P.cy)<4);
  particles(m.px,m.py,'#a78bfa',10);
  m.cx=cell[0]; m.cy=cell[1];
  m.px=m.ox=m.tx=(m.cx+0.5)*G.cs;
  m.py=m.oy=m.ty=(m.cy+0.5)*G.cs;
  m.moving=false; m.stepT=0;
  particles(m.px,m.py,'#a78bfa',10);
  SFX.teleport();
}
// Actualiza visión/sprint y cuenta atrás de teletransporte, cada frame.
function updateMummySpecials(m,dt){
  if(m.dead) return;
  const type=ENEMY_TYPES[m.type];
  if(type.teleport && !m.frozen){
    m.teleTimer-=dt;
    if(m.teleTimer<=0){ teleportMummy(m); m.teleTimer=rand(type.teleport.cooldownMin,type.teleport.cooldownMax); }
  }
  if(type.sight){
    if(!m.frozen && mummySeesPlayer(m)){ m.sightBoost=true; m.boostTimer=type.sight.boostDur; }
    else if(m.boostTimer>0){ m.boostTimer=Math.max(0,m.boostTimer-dt); if(m.boostTimer<=0) m.sightBoost=false; }
  }
}

function stepMummies(dt){ G.mummies.forEach(m=>{ updateMummySpecials(m,dt); stepMummy(m,dt); }); }
function animMummies(dt){
  G.mummies.forEach(m=>{
    if(m.dead){ m.deathAnim=Math.min(1,m.deathAnim+dt*3); return; }
    if(m.moving){
      m.stepT=Math.min(1,m.stepT+dt/m.stepDur);
      m.px=lerp(m.ox,m.tx,eio(m.stepT)); m.py=lerp(m.oy,m.ty,eio(m.stepT));
      if(m.stepT>=1){ m.px=m.tx; m.py=m.ty; m.moving=false; }
    }
  });
}
function stepMummy(m,dt){
  if(m.dead){ m.deathAnim=Math.min(1,m.deathAnim+dt*3); return; }
  if(m.frozen) return;
  if(m.moving){
    m.stepT=Math.min(1,m.stepT+dt/m.stepDur);
    m.px=lerp(m.ox,m.tx,eio(m.stepT)); m.py=lerp(m.oy,m.ty,eio(m.stepT));
    if(m.stepT>=1){ m.px=m.tx; m.py=m.ty; m.moving=false; }
    return;
  }
  const type=ENEMY_TYPES[m.type];
  const P=G.player, opp=OPP[m.dir];
  const dirs=['UP','DOWN','LEFT','RIGHT'];
  let cands=dirs.filter(d=>d!==opp&&mummyWalkable(m,m.cx+DX[d],m.cy+DY[d]));
  if(!cands.length) cands=dirs.filter(d=>mummyWalkable(m,m.cx+DX[d],m.cy+DY[d]));
  if(!cands.length) return;
  let chosen;
  const chase = m.sightBoost ? Math.min(0.97,type.chaseChance+0.2) : type.chaseChance;
  if(Math.random()<chase){
    chosen=cands.reduce((b,d)=>{
      const dd=Math.abs(m.cx+DX[d]-P.cx)+Math.abs(m.cy+DY[d]-P.cy);
      const db=Math.abs(m.cx+DX[b]-P.cx)+Math.abs(m.cy+DY[b]-P.cy);
      return dd<db?d:b;
    });
  } else chosen=cands[Math.floor(Math.random()*cands.length)];
  m.ox=m.px; m.oy=m.py;
  m.cx+=DX[chosen]; m.cy+=DY[chosen];
  m.tx=(m.cx+0.5)*G.cs; m.ty=(m.cy+0.5)*G.cs;
  m.moving=true; m.stepT=0; m.dir=chosen;
  m.stepDur=mummyStepDur(m);
}

// ── SIDE DETECTION ──
function checkSides(){
  const P=G.player;
  const key=`${P.cx},${P.cy}`;
  for(const t of G.tombs){
    if(t.revealed) continue;
    const isNew=!t.visited.has(key);
    if(isNew) t.visited.add(key);
    const sides=tombSideCells(t);
    for(const [side,cells] of Object.entries(sides)){
      if(t.sides[side]) continue;
      if(isNew){
        for(const [cx,cy] of cells){
          if(cx===P.cx&&cy===P.cy){
            G.score+=1;
            floatScore((cx+0.5)*G.cs,(cy+0.5)*G.cs,'+1','#b39ddb');
            break;
          }
        }
      }
      if(cells.every(([cx,cy])=>t.visited.has(`${cx},${cy}`))){
        t.sides[side]=true;
      }
    }
    if(t.sides.top&&t.sides.bottom&&t.sides.left&&t.sides.right) revealTomb(t);
  }
}

function revealTomb(t){
  t.revealed=true; t.revealT=Date.now(); G.revealedTombs++;
  const c=t.content, pts=(c.pts||0)+10;
  G.score+=pts;
  const wx=(t.gx+1.5)*G.cs, wy=(t.gy+1.5)*G.cs;
  floatScore(wx,wy,pts>0?`+${pts}`:`${pts}`,c.color);
  // Rainbow burst particles
  const RCOLS=['#f472b6','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa'];
  for(let i=0;i<12;i++) particles(wx,wy,RCOLS[i%RCOLS.length],2);
  SFX.reveal();
  if(c.pu) activatePU(c.pu);
}

function activatePU(type){
  SFX.powerup();
  if(type==='bomb'){
    const P=G.player; let k=0;
    G.mummies.forEach(m=>{ if(!m.dead&&Math.abs(m.cx-P.cx)+Math.abs(m.cy-P.cy)<=6){ killMummy(m); k++; } });
    particles(P.px,P.py,'#f472b6',18); floatScore(P.px,P.py,k?`💥×${k}`:'💥','#f472b6');
    SFX.bomb();
  } else {
    G.powerups[type]=Date.now()+PU[type].dur;
    if(type==='freeze'){ G.mummies.forEach(m=>{if(!m.dead)m.frozen=true;}); SFX.freeze(); }
    if(type==='slow')  G.mummies.forEach(m=>{if(!m.dead){m.slow=true;m.stepDur=mummyStepDur(m);}});
    if(type==='invincible'){ G.player.invincible=true; G.player.invTime=PU[type].dur/1000; }
    updatePUHUD();
  }
}

function killMummy(m){
  m.dead=true; m.deathAnim=0;
  particles(m.px,m.py,'#f472b6',8);
  G.score+=50; floatScore(m.px,m.py,`+50 ${m.face}`,'#f472b6');
}

// ── COLLISION ──
function checkHit(){
  if(!G.player.alive||G.player.invincible||G.state!=='playing') return;
  const P=G.player;
  for(const m of G.mummies){
    if(m.dead) continue;
    if((m.cx===P.cx&&m.cy===P.cy)||
       (Math.abs(m.px-P.px)<G.cs*0.4&&Math.abs(m.py-P.py)<G.cs*0.4)){
      playerDie(); return;
    }
  }
}
function playerDie(){
  if(G.state!=='playing') return;
  G.player.alive=false; G.player.deathAnim=0; G.state='dying';
  particles(G.player.px,G.player.py,'#a78bfa',14);
  cv.style.animation='shake .35s ease'; setTimeout(()=>cv.style.animation='',350);
  SFX.die();
}
function respawn(){
  const P=G.player;
  P.cx=0;P.cy=0; P.px=P.ox=P.tx=G.cs*0.5; P.py=P.oy=P.ty=G.cs*0.5;
  P.moving=false;P.alive=true;P.deathAnim=0;
  P.activeDir=null;P.queueDir=null;
  P.invincible=true;P.invTime=2.5;
  G.state='playing';
}
function checkWin(){
  if(G.revealedTombs>=G.totalTombs&&G.state==='playing'){
    G.state='winning'; setTimeout(showWin,400);
  }
}

// ── RENDER ──
// Emoji offscreen cache — un solo bitmap sin transformar por emoji+tamaño;
// la rotación/espejo se aplica en el momento de dibujar (drawEmoji)
const _ec=new Map();
function getOfcEmoji(em, sz){
  const key=em+'_'+sz;
  let ofc=_ec.get(key);
  if(!ofc){
    ofc=document.createElement('canvas');
    ofc.width=ofc.height=sz*2; // padding
    const c=ofc.getContext('2d');
    c.font=`${sz}px serif`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(em,sz,sz);
    _ec.set(key,ofc);
  }
  return ofc;
}

// `facing` es el objeto {rotate,flipH,flipV} que devuelve getFacingTransform,
// o null/undefined si el emoji no debe orientarse (nubes, partículas, etc.)
function drawEmoji(em,x,y,sz,facing,alpha=1,glow=null){
  const px=Math.max(8,Math.round(sz)); // no 2× upscale — use exact size
  const ofc=getOfcEmoji(em,px);
  const hw=ofc.width/2;
  ctx.save();
  ctx.globalAlpha=alpha;
  if(glow){ctx.shadowColor=glow;ctx.shadowBlur=12;}
  ctx.translate(x,y);
  if(facing){
    if(facing.rotate) ctx.rotate(facing.rotate);
    const sx=facing.flipH?-1:1, sy=facing.flipV?-1:1;
    if(sx!==1||sy!==1) ctx.scale(sx,sy);
  }
  ctx.drawImage(ofc,-hw,-hw,ofc.width,ofc.height);
  ctx.restore();
  ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.shadowColor='transparent';
}

function render(){
  if(!G) return;
  const {cs,GW,GH,tombs,player,mummies,particles:pts}=G;
  const now=Date.now();
  ctx.clearRect(0,0,cv.width,cv.height);

  // ── Sky background — soft pastel checkerboard ──
  for(let y=0;y<GH;y++){
    for(let x=0;x<GW;x++){
      ctx.fillStyle=(x+y)%2===0?'#e0f2fe':'#f0f9ff';
      ctx.fillRect(x*cs,y*cs,cs,cs);
    }
  }
  // Floating sparkle stars on bg (static, seeded by position)
  if(cs>=14){
    ctx.fillStyle='rgba(167,139,250,0.25)';
    for(let y=0;y<GH;y++) for(let x=0;x<GW;x++){
      const h=((x*7+y*13)%17);
      if(h===0){
        ctx.beginPath();ctx.arc((x+0.5)*cs,(y+0.5)*cs,cs*0.07,0,Math.PI*2);ctx.fill();
      }
    }
  }

  // ── Tombs ──
  for(const t of tombs) drawTomb(t,cs,now);

  // ── Walked corridors — full rainbow per cell ──
  // Each cell gets its own hue from its grid position, cycling the full spectrum
  // Hue formula: (cx * 37 + cy * 61) % 360  → every cell a unique rainbow color
  for(const t of tombs){
    const sides=tombSideCells(t);
    for(const [side,cells] of Object.entries(sides)){
      const sideDone = t.sides[side];
      for(const [cx,cy] of cells){
        if(!t.visited.has(`${cx},${cy}`)) continue;

        // Unique hue per cell position
        const hue = (cx*37 + cy*61) % 360;
        const sat = t.revealed ? 55 : sideDone ? 88 : 78;
        const lit = t.revealed ? 75 : sideDone ? 62 : 68;
        const alpha = t.revealed ? 0.38 : sideDone ? 0.82 : 0.70;

        // Solid fill
        ctx.fillStyle = `hsla(${hue},${sat}%,${lit}%,${alpha})`;
        ctx.fillRect(cx*cs+1, cy*cs+1, cs-2, cs-2);

        // Sheen gradient overlay
        if(cs>=12){
          const grd=ctx.createLinearGradient(cx*cs,cy*cs,cx*cs,cy*cs+cs);
          grd.addColorStop(0,`hsla(${hue},100%,95%,0.45)`);
          grd.addColorStop(1,`hsla(${hue},100%,40%,0.05)`);
          ctx.fillStyle=grd;
          ctx.fillRect(cx*cs+1,cy*cs+1,cs-2,cs-2);
        }

        // Mark glyph
        if(cs>=14){
          const mark = t.revealed ? '✦' : sideDone ? '✓' : '·';
          ctx.fillStyle = t.revealed
            ? `hsla(${hue},60%,35%,0.7)`
            : sideDone
            ? `hsla(${hue},80%,25%,0.85)`
            : `hsla(${hue},70%,30%,0.75)`;
          ctx.font=`bold ${Math.max(7,cs*0.38)}px sans-serif`;
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(mark,(cx+0.5)*cs,(cy+0.5)*cs);
        }
      }
    }
  }

  // ── PU screen tints ──
  if(G.powerups.freeze){ctx.fillStyle='rgba(147,197,253,0.12)';ctx.fillRect(0,0,cv.width,cv.height);}
  if(G.powerups.invincible){
    const rb=['rgba(244,114,182,','rgba(251,146,60,','rgba(250,204,21,','rgba(74,222,128,','rgba(96,165,250,'];
    const ri=Math.floor(now/300)%rb.length;
    ctx.fillStyle=rb[ri]+(0.06+Math.sin(now*.006)*.03)+')';
    ctx.fillRect(0,0,cv.width,cv.height);
  }

  // ── Player ──
  if(player.alive||G.state==='dying'){
    const dead=G.state==='dying';
    const alpha=dead?Math.max(0,1-player.deathAnim):1;
    const scale=dead?1+player.deathAnim*1.8:1;
    // Invincibility: rainbow glow cycling through colors
    const RGLOW=['#f472b6','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa'];
    const blink=player.invincible&&Math.floor(now/120)%2===0;
    const flash=blink?RGLOW[Math.floor(now/120)%RGLOW.length]:null;
    const sz=cs*0.62*scale; // unicorn slightly bigger — it's the star!
    const pFacing=getFacingTransform(player.dir,'player');
    drawEmoji(player.face,player.px,player.py,sz,pFacing,alpha,flash);
  }

  // ── Mummies ──
  for(const m of G.mummies){
    if(m.dead&&m.deathAnim>=1) continue;
    const type=ENEMY_TYPES[m.type];
    const alpha=(m.dead?Math.max(0,1-m.deathAnim):1)*(type.alpha??1);
    const pulse=1+Math.sin(now*0.0022+m.id*1.3)*0.05;
    const scale=m.dead?1+m.deathAnim:pulse;
    const glow=m.frozen?'#4fc3f7':m.slow?'#6bcb77':m.sightBoost?'#f87171':null;
    const sz=cs*0.52*scale; // ← smaller: 52% of cell
    const mFacing=getFacingTransform(m.dir,m.type);
    drawEmoji(m.face,m.px,m.py,sz,mFacing,alpha,glow);
    if(m.frozen&&cs>=14) drawEmoji('❄️',m.px+cs*0.26,m.py-cs*0.26,cs*0.24,null,alpha,null);
  }

  // ── Particles ──
  for(let i=pts.length-1;i>=0;i--){
    const p=pts[i];
    p.x+=p.vx*0.016; p.y+=p.vy*0.016; p.life-=0.025;
    if(p.life<=0){pts.splice(i,1);continue;}
    ctx.globalAlpha=p.life;
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  document.getElementById('hTime').textContent=Math.floor(G.time)+'s';
}

// Cloud color palette — soft, airy pastels
const CLOUD_COLS = ['#f0f9ff','#fdf4ff','#fefce8','#f0fdf4','#fff1f2','#eff6ff'];
const CLOUD_BORD = ['#bae6fd','#e9d5ff','#fde68a','#bbf7d0','#fecdd3','#bfdbfe'];
const CLOUD_BORD2= ['#7dd3fc','#c084fc','#fbbf24','#4ade80','#fb7185','#60a5fa'];

function drawTomb(t,cs,now){
  const {gx,gy,revealed,sides,content,revealT}=t;
  const px=gx*cs,py=gy*cs,tw=3*cs,th=3*cs;
  const cx=px+tw/2, cy=py+th/2;
  const r=cs*0.35; // rounder for cloud feel
  const ci=(t.tc+t.tr*3)%CLOUD_COLS.length;

  if(!revealed){
    // Soft drop shadow
    ctx.fillStyle='rgba(100,120,200,0.10)';
    rrect(px+4,py+5,tw-5,th-5,r); ctx.fill();
    // Cloud body
    ctx.fillStyle=CLOUD_COLS[ci];
    rrect(px+1,py+1,tw-3,th-3,r); ctx.fill();
    // Gradient sheen
    const sheen=ctx.createLinearGradient(px,py,px,py+th);
    sheen.addColorStop(0,'rgba(255,255,255,0.7)');
    sheen.addColorStop(0.5,'rgba(255,255,255,0.1)');
    sheen.addColorStop(1,'rgba(180,200,255,0.15)');
    ctx.fillStyle=sheen; rrect(px+1,py+1,tw-3,th-3,r); ctx.fill();
    // Border — animated color shift
    const phase=(now*0.001+t.tc*0.5+t.tr*0.7)%1;
    ctx.strokeStyle=CLOUD_BORD2[ci]; ctx.lineWidth=Math.max(2,cs*0.09);
    rrect(px+1,py+1,tw-3,th-3,r); ctx.stroke();
    // Cloud emoji
    if(cs>=12) drawEmoji('☁️',cx,cy,cs*0.88,null,1,null);
    // 4 side indicator dots
    const dr=Math.max(3,cs*0.14);
    [[cx,py+cs*0.15,'top'],[cx,py+th-cs*0.15,'bottom'],[px+cs*0.15,cy,'left'],[px+tw-cs*0.15,cy,'right']].forEach(([sx,sy,s])=>{
      ctx.beginPath();ctx.arc(sx,sy,dr,0,Math.PI*2);
      ctx.fillStyle=sides[s]?'#4ade80':'rgba(100,100,200,0.22)'; ctx.fill();
      if(sides[s]){
        ctx.strokeStyle='#15803d'; ctx.lineWidth=1.5; ctx.stroke();
      }
    });
  } else {
    // ── RAINBOW REVEAL ──
    const age=Math.min(1,(now-revealT)/400);
    // White fluffy cloud base
    ctx.fillStyle='rgba(255,255,255,0.18)';
    rrect(px+1,py+1,tw-3,th-3,r); ctx.fill();
    // Rainbow arc drawn with canvas arcs
    if(cs>=12){
      const RW=tw*0.78, RH=th*0.55;
      const rcx=cx, rcy=cy+th*0.12;
      const RCOLS=['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#a78bfa','#f472b6'];
      ctx.save();
      ctx.globalAlpha=age*0.92;
      // clip to cell
      rrect(px+2,py+2,tw-5,th-5,r); ctx.clip();
      for(let i=0;i<RCOLS.length;i++){
        const rr=RW/2-(i*RW*0.055);
        if(rr<2) break;
        ctx.beginPath();
        ctx.arc(rcx,rcy+th*0.1,rr,-Math.PI,0);
        ctx.strokeStyle=RCOLS[i];
        ctx.lineWidth=Math.max(2,RH*0.11);
        ctx.lineCap='round';
        ctx.stroke();
      }
      ctx.restore();
      // Treasure emoji below rainbow
      ctx.globalAlpha=age;
      drawEmoji(content.emoji,cx,cy+th*0.25,cs*0.52,null,age,null);
      ctx.globalAlpha=1;
    }
    // sparkle glitter on revealed cloud
    if(cs>=14&&age>=1){
      const t2=now*0.003;
      const sparkles=[[0.2,0.2],[0.8,0.15],[0.15,0.75],[0.85,0.8],[0.5,0.1]];
      sparkles.forEach(([fx,fy],i)=>{
        const a=0.4+Math.sin(t2+i*1.7)*0.35;
        ctx.globalAlpha=Math.max(0,a);
        drawEmoji('✨',px+fx*tw,py+fy*th,cs*0.22,null,1,null);
      });
      ctx.globalAlpha=1;
    }
  }
}

function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

// ── PARTICLES ──
function particles(x,y,color,n=8){
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n+Math.random()*.5, sp=50+Math.random()*100;
    G.particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,r:2+Math.random()*3.5,color,life:1});
  }
}

// ── FLOAT SCORE ──
function floatScore(x,y,txt,color){
  const el=document.createElement('div'); el.className='fscore';
  const rc=cv.getBoundingClientRect();
  el.style.left=(rc.left+x)+'px'; el.style.top=(rc.top+y)+'px'; el.style.color=color||'#ffd93d';
  el.textContent=txt; document.body.appendChild(el); setTimeout(()=>el.remove(),1100);
}

// ── HUD ──
function updateHUD(){
  if(!G) return;
  document.getElementById('hLvl').textContent=G.lvl;
  document.getElementById('hScore').textContent=G.score.toLocaleString();
}
function updateLivesHUD(){
  const el=document.getElementById('hLives'); el.innerHTML='';
  for(let i=0;i<3;i++){
    const s=document.createElement('span'); s.className='hlife'+(i>=G.lives?' lost':'');
    s.textContent='❤️'; el.appendChild(s);
  }
}
function updatePUHUD(){
  const el=document.getElementById('hPU'); el.innerHTML='';
  for(const [t] of Object.entries(G?.powerups||{})){
    const s=document.createElement('span'); s.className='hpu'; s.textContent=PU[t].emoji; el.appendChild(s);
  }
}

// ── WIN / LOSE ──
function showWin(){
  SFX.win();
  const t=T();
  const bonus=Math.max(0,300-Math.floor(G.time)*2);
  G.score+=bonus;
  if(G.lvl>=sv.maxLevel) sv.maxLevel=Math.min(100,G.lvl+1);
  if(!sv.best[G.lvl]||G.score>sv.best[G.lvl]) sv.best[G.lvl]=G.score;
  sv.scores.push({level:G.lvl,score:G.score,date:new Date().toLocaleDateString()});
  if(sv.scores.length>50) sv.scores.shift();
  save();
  document.getElementById('ovWinScore').textContent=`${t.winScore} ${G.score.toLocaleString()}`;
  document.getElementById('ovWinBonus').textContent=bonus>0?`${t.winBonus} +${bonus}`:'';
  document.getElementById('btnNext').style.display=G.lvl<100?'':'none';
  showPhase(t.lvlClear.replace('{n}',G.lvl),'🎉',()=>document.getElementById('ovWin').classList.add('on'));
}
function showDead(){
  const t=T();
  document.getElementById('ovDeadScore').textContent=`${t.winScore} ${G.score.toLocaleString()}`;
  document.getElementById('ovDeadLvl').textContent=`${t.lvlLabel} ${G.lvl}`;
  document.getElementById('ovDead').classList.add('on');
}
function buildScores(){
  const t=T();
  const el = document.getElementById('scoreList'); el.innerHTML='';
  const list = sv.scores.slice().sort((a,b)=>b.score-a.score).slice(0,10);
  if(!list.length){ el.innerHTML=`<div style="color:#9ca3af;font-size:13px">${t.noScores}</div>`; return; }
  list.forEach((s,i)=>{
    const r=document.createElement('div'); r.className='sc-row';
    const m=['🥇','🥈','🥉'];
    r.innerHTML=`<span class="sc-pos">${m[i]||(i+1)+'º'}</span><span>${t.lvlLabel} ${s.level}</span><span style="color:#9ca3af;font-size:11px">${s.date}</span><span class="sc-pts">${s.score.toLocaleString()}</span>`;
    el.appendChild(r);
  });
}
function hideOvs(){ ['ovPause','ovWin','ovDead'].forEach(id=>document.getElementById(id).classList.remove('on')); }
function nextLevel()  { hideOvs(); startGame(G.lvl+1); }
function retryLevel() { hideOvs(); startGame(G.lvl); }
function quitGame()   { hideOvs(); G=null; goScreen('sTitle'); }
function resumeGame() { hideOvs(); G.paused=false; G.lastTime=null; requestAnimationFrame(loop); }

// ── PHASE OVERLAY ──
function showPhase(txt,face,cb){
  const ov=document.getElementById('phaseOv');
  document.getElementById('phFace').textContent=face;
  document.getElementById('phTxt').textContent=txt;
  ov.style.background='rgba(240,230,255,0.93)';
  ov.classList.add('on');
  setTimeout(()=>{
    ov.style.transition='background .5s';
    ov.style.background='rgba(255,249,240,0)';
    setTimeout(()=>{ ov.classList.remove('on'); ov.style.transition=''; if(cb)cb(); },500);
  },1400);
}

// ── INPUT ──
document.addEventListener('keydown',e=>{
  if(KM[e.key]){
    e.preventDefault();
    if(!G||G.state!=='playing') return;
    G.player.activeDir=KM[e.key];
    G.player.queueDir=KM[e.key];
  }
  if(e.key==='Escape'||e.key==='p'||e.key==='P') togglePause();
});
document.addEventListener('keyup',e=>{
  if(KM[e.key]&&G?.player&&G.player.activeDir===KM[e.key]) G.player.activeDir=null;
});
function togglePause(){
  if(!G) return;
  G.paused=!G.paused;
  if(G.paused) document.getElementById('ovPause').classList.add('on');
  else resumeGame();
}
// ── TOUCH-ONLY DETECTION (no physical keyboard → show overlay dpads) ──
// We detect absence of a real keyboard: pointer:coarse + no keyboard events yet
let _hasKeyboard = false;
document.addEventListener('keydown', ()=>{ _hasKeyboard=true; updateDpadVisibility(); }, {once:true});

function hasTouchInput(){ return ('ontouchstart' in window) || navigator.maxTouchPoints>0; }
function updateDpadVisibility(){
  const show = hasTouchInput() && !_hasKeyboard;
  document.getElementById('dpadL').style.display = show ? 'block' : 'none';
  document.getElementById('dpadR').style.display = show ? 'block' : 'none';
}
// Run on load + after a short delay to catch tablets that report touch
updateDpadVisibility();
setTimeout(updateDpadVisibility, 300);

// ── DPAD BUTTON BINDINGS ──
// Map: buttonId → direction
const dpadMap = [
  ['bU','UP'],['bD','DOWN'],['bL','LEFT'],['bR','RIGHT'],
  ['bU2','UP'],['bD2','DOWN'],['bLR','RIGHT'],['bRL','LEFT'],
];
dpadMap.forEach(([id,d])=>{
  const btn=document.getElementById(id); if(!btn) return;
  const pad = btn.closest('#dpadL,#dpadR');
  const press=e=>{
    e.preventDefault();
    if(pad) pad.classList.add('touched');
    if(G?.state==='playing'){ G.player.activeDir=d; G.player.queueDir=d; }
  };
  const rel=e=>{
    e.preventDefault();
    if(pad) pad.classList.remove('touched');
    if(G?.player&&G.player.activeDir===d) G.player.activeDir=null;
  };
  btn.addEventListener('touchstart',press,{passive:false});
  btn.addEventListener('touchend',rel,{passive:false});
  btn.addEventListener('touchcancel',rel,{passive:false});
  btn.addEventListener('mousedown',press);
  btn.addEventListener('mouseup',rel);
  btn.addEventListener('mouseleave',rel);
});
let swS=null;
cv.addEventListener('touchstart',e=>{swS={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
cv.addEventListener('touchend',e=>{
  if(!swS||G?.state!=='playing') return;
  const dx=e.changedTouches[0].clientX-swS.x, dy=e.changedTouches[0].clientY-swS.y;
  if(Math.abs(dx)>Math.abs(dy)&&Math.abs(dx)>16) G.player.queueDir=dx>0?'RIGHT':'LEFT';
  else if(Math.abs(dy)>16) G.player.queueDir=dy>0?'DOWN':'UP';
  swS=null;
},{passive:true});

// ── RESIZE ──
window.addEventListener('resize',()=>{
  updateDpadVisibility();
  if(!G||G.state==='gameover') return;
  const cs=calcCS(G.GW,G.GH);
  if(cs===G.cs) return;
  const sx=cs/G.cs; G.cs=cs;
  cv.width=G.GW*cs; cv.height=G.GH*cs;
  _ec.clear();
  const rs=o=>{ o.px*=sx;o.py*=sx;o.tx*=sx;o.ty*=sx;o.ox*=sx;o.oy*=sx; };
  rs(G.player); G.mummies.forEach(rs);
});

const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
